<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173C2B"/>
      <stop offset="1" stop-color="#0B2419"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62D66D"/>
      <stop offset="1" stop-color="#249A50"/>
    </linearGradient>
    <linearGradient id="walletDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36B85D"/>
      <stop offset="1" stop-color="#14743E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- App-icon background -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)"/>
  <rect x="13.5" y="13.5" width="485" height="485" rx="110.5"
        fill="none" stroke="#2C6E4A" stroke-width="3"/>

  <!-- Wallet -->
  <g filter="url(#shadow)">
    <!-- money -->
    <rect x="116" y="108" width="238" height="116" rx="28" fill="#A9F0A6"
          transform="rotate(-4 116 108)"/>
    <rect x="139" y="126" width="192" height="80" rx="20" fill="#43C86A"
          transform="rotate(-4 139 126)"/>
    <circle cx="236" cy="166" r="25" fill="#0F5130"/>
    <path d="M224 165h24M228 155v23M244 155c-7-7-20-3-20 5 0 11 21 4 21 15 0 8-14 12-22 5"
          fill="none" stroke="#B9F2A8" stroke-width="5" stroke-linecap="round"/>

    <!-- wallet body -->
    <path d="M96 166h285c25 0 45 20 45 45v153c0 28-22 50-50 50H96c-28 0-50-22-50-50V216c0-28 22-50 50-50Z"
          fill="url(#wallet)" stroke="#8BE58A" stroke-width="5"/>
    <path d="M74 232h306c26 0 47 21 47 47v58c0 26-21 47-47 47H74c-25 0-45-20-45-45V277c0-25 20-45 45-45Z"
          fill="url(#walletDark)"/>
    <path d="M82 249h291c16 0 29 13 29 29v63c0 16-13 29-29 29H82c-16 0-29-13-29-29v-63c0-16 13-29 29-29Z"
          fill="#18804A" opacity=".55"/>

    <!-- clasp -->
    <path d="M347 278h70c22 0 39 17 39 39s-17 39-39 39h-70c-16 0-29-13-29-29v-20c0-16 13-29 29-29Z"
          fill="#3AC665" stroke="#8BE58A" stroke-width="4"/>
    <circle cx="382" cy="317" r="10" fill="#D8F7A5"/>
    <circle cx="382" cy="317" r="5" fill="#1A6C3E"/>
  </g>

  <!-- small ledger mark -->
  <g transform="translate(116 342)">
    <rect x="0" y="0" width="92" height="62" rx="12" fill="#0D4A2D" opacity=".9"/>
    <path d="M18 18h12M18 31h12M18 44h12" stroke="#6FE27B" stroke-width="6" stroke-linecap="round"/>
    <path d="M48 19h27M48 32h27M48 45h18" stroke="#D6F5D1" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
